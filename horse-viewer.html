<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horse 3D Model Viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  model-viewer {
    width: 100%;
    height: 100%;
    background-color: #1a1a1a;
    --poster-color: transparent;
    --progress-bar-color: #ffffff;
  }
  .hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    pointer-events: none;
    letter-spacing: 0.3px;
  }
  .ar-button {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(255,255,255,0.9);
    border-radius: 6px;
    border: none;
    padding: 8px 14px;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

<model-viewer
  id="horse"
  src="horse-final-textured.glb"
  alt="3D scanned model of a horse"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  auto-rotate-delay="1500"
  rotation-per-second="18deg"
  shadow-intensity="1"
  shadow-softness="0.8"
  exposure="1.1"
  environment-image="neutral"
  camera-orbit="0deg 85deg 65%"
  min-camera-orbit="auto auto 100%"
  max-camera-orbit="auto auto 200%"
  interaction-prompt="none"
  ar
  ar-modes="webxr scene-viewer quick-look"
>
  <button slot="ar-button" class="ar-button">View in your space</button>
  <div slot="progress-bar"></div>
</model-viewer>
<div class="hint">Drag to rotate &middot; Scroll to zoom</div>

</body>
</html>
